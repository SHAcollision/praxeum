[package]
name = "praxeum-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for playing Praxeum economics exercises"
license = "MIT OR Apache-2.0"
authors = ["Praxeum Contributors"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
praxeum-core = { path = "../praxeum-core" }
inquire = "0.7"

[[bin]]
name = "praxeum-cli"
path = "src/main.rs"
