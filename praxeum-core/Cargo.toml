[package]
name = "praxeum-core"
version = "0.1.0"
edition = "2021"
description = "Praxeum core engine for economics learning exercises"
license = "MIT OR Apache-2.0"
readme = "../README.md"
authors = ["Praxeum Contributors"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
