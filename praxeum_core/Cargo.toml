[package]
name = "praxeum_core"
version = "0.1.0"
edition = "2021"
description = "Praxeum core engine and CLI for economics learning exercises"
license = "MIT OR Apache-2.0"
readme = "../README.md"
authors = ["Praxeum Contributors"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "praxeum_cli"
path = "src/bin/praxeum_cli.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
